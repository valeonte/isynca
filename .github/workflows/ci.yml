name: CI

on:
  push:
  pull_request:

# A new push to the same branch makes an in-flight run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: format, lint, types, tests
    # pixi.toml declares platforms = ["linux-64"], so the environment only
    # solves on Linux. Adding another platform there means adding a matrix here.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          # --locked fails if pixi.lock has drifted from pixi.toml, so a
          # manifest edit without a re-lock is caught here rather than
          # silently resolving to different versions than anyone tested.
          locked: true
          cache: true
          # Pinned to match the dev environment; this project pins ruff and ty
          # exactly for the same reason. Bump deliberately.
          pixi-version: v0.79.0

      # Each check runs even if an earlier one failed, so one CI run reports
      # every problem instead of revealing them one at a time.
      - name: Format
        if: ${{ !cancelled() }}
        run: pixi run fmt-check

      - name: Lint
        if: ${{ !cancelled() }}
        run: pixi run lint

      - name: Types
        if: ${{ !cancelled() }}
        run: pixi run typecheck

      - name: Tests
        if: ${{ !cancelled() }}
        run: pixi run test
